<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Application with Open Questions</title></head>
<body>
  <h1>Tell Us About Yourself</h1>
  <form>
    <div>
      <label for="cover_letter">Cover Letter</label>
      <textarea id="cover_letter" name="cover_letter" rows="8" placeholder="Tell us why you want to work here..."></textarea>
    </div>
    <div>
      <label for="why_us">Why do you want to work at Acme?</label>
      <textarea id="why_us" name="why_us" rows="5" required aria-required="true"></textarea>
    </div>
    <div>
      <label for="greatest_achievement">Describe your greatest professional achievement</label>
      <textarea id="greatest_achievement" name="greatest_achievement" rows="5"></textarea>
    </div>
  </form>
</body>
</html>
