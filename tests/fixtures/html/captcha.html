<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Application — Verification Required</title></head>
<body>
  <h1>Verify You Are Human</h1>
  <p>Please complete the CAPTCHA below to continue your application.</p>
  <div class="g-recaptcha" data-sitekey="test-key"></div>
  <form>
    <label for="email">Email</label>
    <input type="email" id="email" name="email">
    <button type="submit">Continue</button>
  </form>
</body>
</html>
